name: Check unified navigation
on:
  push:
    branches: ["fix/unified-market-navigation"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          node --check market-entry.js
          node --check market-data.js
          test -s market-data.html
          test -s market-data.css
