name: Check Market Data V1.1

on:
  push:
    branches: ["feature/market-data-v1-1"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Syntax check
        run: |
          node --check market-data.js
          node --check market-entry.js
          test -s market-data.html
          test -s market-data.css
